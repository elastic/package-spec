format_version: 3.6.0
name: bad_root_policy_templates
type: integration
title: Nginx
version: 0.1.0
description: Collect logs and metrics from Nginx.
categories:
  - web
  - observability
conditions:
  kibana:
    version: "^9.0.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/logo_nginx.svg
    title: logo nginx
    size: 32x32
    type: image/svg+xml
schemas:
  default: otel
  ecs:
    requires:
      integration: [{ package: nginx, version: "^3.0.0" }]
  otel:
    requires:
      integration: [{ package: nginx_otel_integ, version: "^0.1.0" }]
owner:
  github: elastic/ecosystem
  type: elastic
policy_templates:
  - name: nginx
    title: Nginx logs
    description: Collect logs from Nginx instances
    inputs:
      - type: logfile
        title: Collect logs from Nginx
        description: Collecting Nginx access and error logs
