format_version: 3.6.0
name: good_built_input_group
title: Good Built Input Group Member
description: Built input package that carries the group.yml copied from its parent group directory.
version: 0.0.1
type: input
group: nginx
source:
  license: "Apache-2.0"
conditions:
  kibana:
    version: '^8.0.0 || ^9.0.0'
policy_templates:
  - name: logs
    type: logs
    title: Custom logs
    description: Collect custom log files.
    input: logfile
    template_path: input.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        required: true
        show_user: true
owner:
  github: elastic/foobar
  type: community
