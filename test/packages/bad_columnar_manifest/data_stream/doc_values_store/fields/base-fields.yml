- name: data_stream.type
  type: constant_keyword
  description: Data stream type.
- name: data_stream.dataset
  type: constant_keyword
  description: Data stream dataset.
- name: data_stream.namespace
  type: constant_keyword
  description: Data stream namespace.
- name: '@timestamp'
  type: date
  description: Event timestamp.
- name: event.original
  type: keyword
  index: false
  doc_values: false
  description: Without doc values, which columnar index modes need to rebuild _source.
- name: message
  type: text
  store: true
  description: Stored, which columnar index modes reject.
  multi_fields:
    - name: raw
      type: keyword
      store: true
    - name: exact
      type: keyword
      doc_values: false
