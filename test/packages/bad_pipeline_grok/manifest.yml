format_version: 3.7.0
name: bad_pipeline_grok
title: "Package with malformed grok tokens"
version: 1.0.0
source:
  license: "Elastic-2.0"
description: "This is a package whose grok patterns contain %{ that grok does not read as a token"
type: integration
categories:
  - custom
conditions:
  kibana:
    version: "^8.9.1"
  elastic:
    subscription: "basic"
  agent:
    version: '^9.1.0'
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/sample-logo.svg
    title: Sample logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: sample
    title: Sample logs
    description: Collect sample logs
    inputs:
      - type: logfile
        title: Collect sample logs from instances
        description: Collecting sample logs
owner:
  github: elastic/integrations
  type: elastic
