format_version: 3.7.0
name: bad_columnar_input_copy_to
title: Bad columnar input package with copy_to
description: Tests that copy_to on a root field is a hard error for columnar input packages.
version: 0.0.1
type: input
source:
  license: "Apache-2.0"
categories:
  - custom
conditions:
  kibana:
    version: "^9.5.0"
  elastic:
    subscription: "basic"
policy_templates:
  - name: logs
    type: logs
    title: Collect logs
    description: Collect logs from files.
    input: logfile
    template_path: input.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        default:
          - /var/log/*.log
elasticsearch:
  index_mode: logsdb_columnar
owner:
  github: elastic/obs-infraobs-integrations
  type: elastic
