format_version: 3.6.6
name: good_workflow_integration
title: "Good Workflow Integration"
version: 0.0.1
source:
  license: "Elastic-2.0"
description: "Test package shipping Kibana workflow assets."
type: integration
categories:
  - custom
conditions:
  kibana:
    version: "^9.7.0"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/sample-logo.svg
    title: Sample logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: sample
    title: Sample logs
    description: Collect sample logs
    inputs:
      - type: logfile
        title: Collect sample logs from instances
        description: Collecting sample logs
owner:
  github: elastic/integrations
  type: elastic
