spec:
  type: object
  additionalProperties: false
  properties:
    name:
      description: Name of the ES|QL view. Must be lowercase and match the filename stem.
      type: string
      pattern: '^[a-z][a-z0-9_\-]*$'
    description:
      description: Human-readable description of the ES|QL view
      type: string
    query:
      description: ES|QL query defining the view
      type: string
      minLength: 1
  required:
    - name
    - query
