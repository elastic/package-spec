spec:
  type: object
  additionalProperties: false
  properties:
    name:
      description: Name of the ES|QL view
      type: string
      pattern: '^[a-zA-Z0-9_\-]+$'
    description:
      description: Human-readable description of the ES|QL view
      type: string
    query:
      description: ES|QL query defining the view
      type: string
      minLength: 1
  required:
    - name
    - query
