spec:
  additionalContents: false
  contents:
    - description: >-
        Folder containing Elasticsearch ES|QL view definitions. ES|QL views are
        cluster-state objects installed into the global Elasticsearch index
        namespace via PUT /_query/view/<name> (not scoped to a data stream).
        They are installed after index templates and require Elasticsearch 9.4+
        or Elastic Serverless.
      type: folder
      name: esql_view
      required: false
      additionalContents: false
      contents:
        - description: ES|QL view definition in YAML
          type: file
          pattern: '^{PACKAGE_NAME}-.+\.yml$'
          contentMediaType: "application/x-yaml"
          required: false
          $ref: "../../integration/elasticsearch/view.spec.yml"
